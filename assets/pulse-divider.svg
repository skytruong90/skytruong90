<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="Animated telemetry divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00C8FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#00FFB2" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <line x1="40" y1="18" x2="1160" y2="18" stroke="url(#line)" stroke-width="1.5"/>
  <circle cy="18" r="7" fill="#00C8FF" opacity=".25" filter="url(#g)"><animate attributeName="cx" from="40" to="1160" dur="4.8s" repeatCount="indefinite"/></circle>
  <circle cy="18" r="2.8" fill="#D8F7FF"><animate attributeName="cx" from="40" to="1160" dur="4.8s" repeatCount="indefinite"/></circle>
</svg>