    <text x="398" y="32" font-size="12" fill="#BDB1FF">GNC</text>
    <circle cx="446" cy="27" r="2.2" fill="#27495A"/>
    <text x="458" y="32" font-size="12" fill="#78DFFF">SENSORS &amp; TRACKING</text>
    <circle cx="650" cy="27" r="2.2" fill="#27495A"/>
