  <path d="M28 60H1172" stroke="#17394C" stroke-width="1"/>
  <path d="M28 60H1172" stroke="#00C8FF" stroke-opacity=".14" stroke-width="1"/>
  <g fill="#00C8FF" filter="url(#glow)">
