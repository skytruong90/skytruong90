<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="88" viewBox="0 0 1200 88" role="img" aria-label="Animated engineering focus strip">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#04090E"/><stop offset=".5" stop-color="#07131D"/><stop offset="1" stop-color="#04090E"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#00C8FF" stop-opacity="0"/><stop offset=".5" stop-color="#00C8FF" stop-opacity=".55"/><stop offset=".75" stop-color="#9B8CFF" stop-opacity=".35"/><stop offset="1" stop-color="#00FFB2" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="86" rx="14" fill="url(#bg)" stroke="#173A4D"/>
  <rect x="-240" y="1" width="220" height="86" fill="url(#beam)" opacity=".12"><animate attributeName="x" from="-240" to="1220" dur="6.8s" repeatCount="indefinite"/></rect>
