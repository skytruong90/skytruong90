<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="David K. Tan aerospace software engineering animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A0F"/>
      <stop offset="0.55" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#07131C"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#00FFB2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00FFB2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00FFB2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid{stroke:#17364A;stroke-width:1;opacity:.35}.star{fill:#7CDFFF}.label{font-family:'Segoe UI',Arial,sans-serif;letter-spacing:4px}.mono{font-family:'Consolas','Courier New',monospace}.pulse{animation:pulse 1.8s ease-in-out infinite}.tw1{animation:tw 2.8s ease-in-out infinite}.tw2{animation:tw 3.8s ease-in-out infinite reverse}.tw3{animation:tw 4.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.18}50%{opacity:.95}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#16394D"/>

  <g opacity=".45">
    <path class="grid" d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path class="grid" d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>

  <g>
    <circle class="star tw1" cx="80" cy="45" r="1.8"/><circle class="star tw2" cx="160" cy="92" r="1.3"/><circle class="star tw3" cx="250" cy="38" r="1.5"/><circle class="star tw2" cx="348" cy="76" r="1.1"/><circle class="star tw1" cx="520" cy="34" r="1.6"/><circle class="star tw3" cx="650" cy="86" r="1.2"/><circle class="star tw1" cx="770" cy="52" r="1.7"/><circle class="star tw2" cx="1080" cy="46" r="1.5"/>
    <circle class="star tw3" cx="112" cy="246" r="1.2"/><circle class="star tw1" cx="290" cy="220" r="1.7"/><circle class="star tw2" cx="490" cy="260" r="1.2"/><circle class="star tw3" cx="715" cy="232" r="1.5"/><circle class="star tw1" cx="1088" cy="254" r="1.4"/>
  </g>

  <rect x="-300" y="0" width="260" height="300" fill="url(#cyan)" opacity=".08">
    <animate attributeName="x" from="-300" to="1300" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(1010 150)">
    <circle r="94" fill="url(#radar)" stroke="#00FFB2" stroke-opacity=".16"/>
    <circle r="66" fill="none" stroke="#00FFB2" stroke-opacity=".25"/>
    <circle r="36" fill="none" stroke="#00FFB2" stroke-opacity=".28"/>
    <path d="M0 0 L86 -34 A92 92 0 0 1 92 0 Z" fill="#00FFB2" opacity=".18">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </path>
    <line x1="-94" y1="0" x2="94" y2="0" stroke="#00FFB2" stroke-opacity=".12"/>
    <line x1="0" y1="-94" x2="0" y2="94" stroke="#00FFB2" stroke-opacity=".12"/>
    <circle cx="38" cy="-42" r="3" fill="#00FFB2" filter="url(#glow)" class="pulse"/>
    <circle cx="-48" cy="22" r="2.5" fill="#00C8FF" filter="url(#glow)" class="pulse"/>
  </g>

  <path id="trajectory" d="M720 235 C790 175 850 120 930 88 C965 74 995 64 1038 58" fill="none" stroke="#00C8FF" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 8"/>
  <circle r="4" fill="#FFFFFF" filter="url(#glow)">
    <animateMotion dur="6.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trajectory"/>
    </animateMotion>
  </circle>

  <g transform="translate(74 76)">
    <text class="label" x="0" y="0" fill="#74DFFF" font-size="15">SOFTWARE ENGINEER • AEROSPACE &amp; DEFENSE</text>
    <text class="mono" x="0" y="60" fill="#F4F8FB" font-size="46" font-weight="700">DAVID K. TAN</text>
    <text class="label" x="2" y="100" fill="#9FC4D8" font-size="14">MODELING &amp; SIMULATION  /  MISSION SOFTWARE  /  SECURE SYSTEMS</text>
  </g>

  <g transform="translate(76 226)" class="mono" font-size="13">
    <rect x="0" y="0" width="410" height="34" rx="8" fill="#08121C" stroke="#17394C"/>
    <circle cx="18" cy="17" r="5" fill="#00FF88" filter="url(#glow)" class="pulse"/>
    <text x="33" y="22" fill="#BFE7F5">SYSTEM STATUS: ONLINE</text>
    <text x="205" y="22" fill="#5F8699">//</text>
    <text x="233" y="22" fill="#74DFFF">6DOF  GNC  RADAR  V&amp;V</text>
  </g>
</svg>