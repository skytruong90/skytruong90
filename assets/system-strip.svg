<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="Animated engineering system status strip">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#050A0F"/><stop offset="0.5" stop-color="#0A1620"/><stop offset="1" stop-color="#050A0F"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#00C8FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00C8FF" stop-opacity="0.65"/><stop offset="1" stop-color="#00FFB2" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="1" y="1" width="1198" height="90" rx="14" fill="url(#bg)" stroke="#15384B"/>
  <path d="M28 64H1172" stroke="#17394C" stroke-width="1"/>
  <path d="M28 66H1172" stroke="#00C8FF" stroke-opacity="0.16" stroke-width="1"/>

  <rect x="-240" y="1" width="220" height="90" fill="url(#beam)" opacity="0.18"><animate attributeName="x" from="-240" to="1220" dur="6.2s" repeatCount="indefinite"/></rect>

  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="38" cy="28" r="5" fill="#00FF88" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="54" y="34" font-size="15" fill="#C9F7E4">SYSTEMS ONLINE</text>
    <circle cx="212" cy="28" r="2.5" fill="#00C8FF"/>
    <text x="225" y="34" font-size="13" fill="#7CDFFF">AEROSPACE SOFTWARE LAB</text>

    <text x="515" y="34" font-size="12" fill="#6E8D9E">LINK</text>
    <text x="558" y="34" font-size="12" fill="#00FFB2">SECURE</text>
    <circle cx="625" cy="28" r="2" fill="#24495A"/>
    <text x="637" y="34" font-size="12" fill="#6E8D9E">BUILD</text>
    <text x="686" y="34" font-size="12" fill="#00C8FF">PASSING</text>
    <circle cx="766" cy="28" r="2" fill="#24495A"/>
    <text x="778" y="34" font-size="12" fill="#6E8D9E">MODE</text>
    <text x="825" y="34" font-size="12" fill="#FFB84D">SIMULATION</text>

    <text x="28" y="82" font-size="11" fill="#4E7488">6DOF</text>
    <text x="185" y="82" font-size="11" fill="#4E7488">GNC</text>
    <text x="340" y="82" font-size="11" fill="#4E7488">SENSORS</text>
    <text x="520" y="82" font-size="11" fill="#4E7488">TRACKING</text>
    <text x="710" y="82" font-size="11" fill="#4E7488">V&amp;V</text>
    <text x="865" y="82" font-size="11" fill="#4E7488">PLATFORMS</text>
    <text x="1055" y="82" font-size="11" fill="#4E7488">DEVSECOPS</text>
  </g>

  <g fill="#00C8FF" filter="url(#glow)">
    <circle cy="65" r="3"><animate attributeName="cx" values="30;1168" dur="7.8s" repeatCount="indefinite"/></circle>
    <circle cy="65" r="2" opacity="0.65"><animate attributeName="cx" values="30;1168" dur="7.8s" begin="-2.6s" repeatCount="indefinite"/></circle>
    <circle cy="65" r="2" opacity="0.45"><animate attributeName="cx" values="30;1168" dur="7.8s" begin="-5.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(1040 18)" stroke="#00FFB2" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M0 12h12l5-8 7 18 7-12 8 4h36" opacity=".7"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></path>
  </g>
</svg>